<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>青空之下 · 高校青春物语</title>
<style>
  :root{
    --bg:#0e1220; --panel:#1a2138; --panel2:#222b46; --ink:#eaf0ff; --dim:#9aa6c4;
    --accent:#ff6b9d; --accent2:#6ba8ff; --gold:#ffce6b; --good:#4ade80; --bad:#f87171;
    --line:#2c3654; --shadow:0 8px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
    display:flex; justify-content:center; align-items:center;
    background-image:radial-gradient(circle at 20% 10%,#1c2640 0,transparent 45%),
                     radial-gradient(circle at 85% 90%,#241a38 0,transparent 45%),var(--bg);
  }
  #app{width:100%; max-width:520px; min-height:100vh; position:relative; overflow:hidden;
       background:var(--panel); box-shadow:var(--shadow);}
  @media(min-width:520px){ #app{border-radius:20px; min-height:88vh; max-height:96vh; margin:2vh auto;} }
  /* background layer */
  #bgLayer{position:absolute; inset:0; z-index:0; pointer-events:none;}
  #bgLayer img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:saturate(.9) brightness(.6);}
  #bgLayer .veil{position:absolute; inset:0; background:linear-gradient(180deg,rgba(10,14,28,.35),rgba(10,14,28,.82));}
  /* main screen */
  #screen{position:relative; z-index:1; padding:16px 16px 90px;}
  h1.title{font-size:26px; margin:0 0 6px; letter-spacing:1px;}
  .sub{color:var(--dim); font-size:13px; margin:0 0 18px;}
  .card{background:linear-gradient(180deg,rgba(38,46,74,.92),rgba(26,33,56,.94));
        border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow);}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .between{display:flex; justify-content:space-between; align-items:center;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:7px;
       background:var(--panel2); color:var(--ink); border:1px solid var(--line);
       border-radius:12px; padding:11px 14px; font-size:14px; cursor:pointer; user-select:none;
       transition:transform .08s ease, filter .12s ease, background .12s;}
  .btn:hover{filter:brightness(1.12);}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:linear-gradient(135deg,#ff6b9d,#ff4d7e); border-color:transparent; font-weight:600;}
  .btn.accent{background:linear-gradient(135deg,#6ba8ff,#3d7bff); border-color:transparent; font-weight:600;}
  .btn.gold{background:linear-gradient(135deg,#ffce6b,#f0a020); color:#3a2400; border-color:transparent; font-weight:600;}
  .btn.ghost{background:transparent;}
  .btn.sm{padding:7px 10px; font-size:12.5px; border-radius:10px;}
  .btn:disabled{opacity:.4; cursor:not-allowed; filter:none;}
  .btn.block{width:100%;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .grid4{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:9px;}
  /* HUD */
  #hud{position:sticky; top:0; z-index:5; background:linear-gradient(180deg,rgba(14,18,32,.98),rgba(14,18,32,.86));
       border-bottom:1px solid var(--line); padding:12px 16px; margin:-16px -16px 16px; backdrop-filter:blur(6px);}
  .hud-top{display:flex; align-items:center; justify-content:space-between;}
  .hud-name{font-weight:700; font-size:16px;}
  .hud-name .gen{font-size:11px; color:var(--dim); font-weight:500; margin-left:6px;}
  .hud-sub{color:var(--dim); font-size:12px; margin-top:2px;}
  .bar-wrap{background:#0b0f1e; border-radius:8px; height:9px; overflow:hidden; flex:1;}
  .bar{height:100%; border-radius:8px; transition:width .4s ease;}
  .bar.sta{background:linear-gradient(90deg,#4ade80,#22c55e);}
  .bar.mood{background:linear-gradient(90deg,#ffce6b,#f59e0b);}
  .chip{display:inline-flex; align-items:center; gap:4px; background:var(--panel2);
        border:1px solid var(--line); border-radius:8px; padding:3px 8px; font-size:12px;}
  .energy{display:flex; gap:4px;}
  .energy i{width:10px; height:10px; border-radius:50%; background:var(--gold); display:block;}
  .energy i.off{background:#2c3654;}
  /* portrait */
  .portrait{display:flex; flex-direction:column; align-items:center;}
  .portrait svg{width:100%; height:auto; max-width:150px; filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));}
  .portrait .pname{font-weight:700; margin-top:6px; font-size:14px;}
  .portrait .prole{color:var(--dim); font-size:11px;}
  /* attr list */
  .attr{display:flex; align-items:center; justify-content:space-between; gap:8px;
        background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:8px 10px;}
  .attr .k{font-size:13px;} .attr .v{font-weight:700; font-size:15px; color:var(--gold);}
  .attr.selectable{cursor:pointer; transition:transform .08s, border-color .12s;}
  .attr.selectable:hover{border-color:var(--accent);}
  .attr.selectable.sel{border-color:var(--accent); background:rgba(255,107,157,.16); box-shadow:0 0 0 1px var(--accent);}
  .attr.selectable.lock{opacity:.35; cursor:not-allowed;}
  /* dialogue box */
  .dlg{position:relative; background:linear-gradient(180deg,rgba(20,26,46,.96),rgba(16,20,38,.96));
       border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px;}
  .dlg .who{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .dlg .who .avatar{width:44px; height:44px; border-radius:50%; overflow:hidden; background:var(--panel2); border:2px solid var(--accent); flex:0 0 auto;}
  .dlg .who .avatar svg{width:100%; height:100%;}
  .dlg .who .nm{font-weight:700; font-size:15px;}
  .dlg .who .rl{color:var(--dim); font-size:11px;}
  .dlg .txt{font-size:15px; line-height:1.75; color:#eef2ff; min-height:60px;}
  .dlg .txt .hl{color:var(--accent); font-weight:600;}
  .dlg .tag{color:var(--gold);}
  .choices{margin-top:12px; display:flex; flex-direction:column; gap:9px;}
  /* ending */
  .ending-box{text-align:center;}
  .ending-box .big{font-size:15px; line-height:1.9; color:#eef2ff; text-align:left;}
  .badge{display:inline-block; padding:5px 12px; border-radius:999px; font-size:12px; font-weight:700; letter-spacing:1px;}
  .badge.love{background:linear-gradient(135deg,#ff6b9d,#ff4d7e);}
  .badge.friend{background:linear-gradient(135deg,#6ba8ff,#3d7bff);}
  .badge.school{background:linear-gradient(135deg,#ffce6b,#f0a020); color:#3a2400;}
  /* nav bottom */
  #nav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px;
       display:flex; gap:8px; padding:10px 12px; background:linear-gradient(0deg,rgba(10,13,24,.97),rgba(10,13,24,.7));
       border-top:1px solid var(--line); z-index:20; backdrop-filter:blur(8px);}
  #nav .btn{flex:1; padding:10px 6px; font-size:13px;}
  .scroll{max-height:58vh; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .scroll::-webkit-scrollbar{width:5px;} .scroll::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;}
  .float{animation:floaty 3.2s ease-in-out infinite;}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .fade{animation:fadein .35s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  .hint{color:var(--dim); font-size:12px; line-height:1.6;}
  .small{font-size:12px; color:var(--dim);}
  .divider{height:1px; background:var(--line); margin:12px 0;}
  input[type=text]{width:100%; background:#0b0f1e; border:1px solid var(--line); color:var(--ink);
       border-radius:12px; padding:13px 14px; font-size:16px; outline:none;}
  input[type=text]:focus{border-color:var(--accent);}
  .heart{color:var(--accent);}
  .aff-bar{height:6px; background:#0b0f1e; border-radius:4px; overflow:hidden; flex:1;}
  .aff-bar .fill{height:100%; background:linear-gradient(90deg,#ff6b9d,#ff4d7e); border-radius:4px; transition:width .4s;}
</style>
</head>
<body>
<div id="app">
  <div id="bgLayer"></div>
  <div id="screen"></div>
</div>
<div id="nav"></div>

    ${body}

function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

const WEEKS_PER_YEAR = 24;
function year(){ return Math.min(3, Math.ceil(state.week / WEEKS_PER_YEAR)); }
function yearWeek(){ return state.week - (year()-1)*WEEKS_PER_YEAR; }
function term(){ return yearWeek()<=12?1:2; }
function weekLabel(){
  const y=year(), yw=yearWeek(), tm=yw<=12?1:2, tw=yw<=12?yw:yw-12;
  return `高${'一二三'[y-1]}${tm===1?'上':'下'}·第${tw}周`;
}

const $ = sel => document.querySelector(sel);

function rnd(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr,n){
  const a=[...arr], out=[];
  while(out.length<n && a.length){ out.push(a.splice(Math.floor(Math.random()*a.length),1)[0]); }
  return out;
}
function setBG(bg){
  const el=$('#bgLayer'); if(!el) return;
  el.innerHTML = `<img src="${BGS[bg]||BGS.classroom}" alt=""><div class="veil"></div>`;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function af(id){ return state.affection[id]||0; }
function addAff(id, n){
  const cur = af(id);
  state.affection[id] = Math.max(0, Math.min(100, cur + n));
}

function currentBG(){
  if(state.screen==='game') return 'classroom';
  if(state.screen==='event' && state.evt && state.evt.bg) return state.evt.bg;
  if(state.screen==='action') return 'classroom';

function renderDraft(){

  if(d.round.length===0){

  }
  const need = d.round.length;
  const pickedCount = d.round.filter(r=>r.picked).length;
  const done = pickedCount===need;
  const rows = d.round.map(r=>{

            const assigned = !d.remaining.includes(a.k);
            const sel = r.picked===a.k;
            const cls = sel?'sel':(usedElse||assigned?'lock':'');

            return `<div class="attr selectable ${cls}" data-action="draft-pick" data-cid="${c.id}" data-attr="${a.k}">

      <div class="between">

/* =========================================================================
   逻辑
========================================================================= */
function initRelationships(){
  // 初始好感度：同班同学略高
  CHARACTERS.forEach(c=>{ state.affection[c.id]=state.affection[c.id]||0; });
}
function pushWeekIntro(){
  state.log.unshift(`高中生活开始啦！欢迎你，${state.name}。`);
  addAffAll(3);
}
function addAffAll(n){ CHARACTERS.forEach(c=>addAff(c.id,n)); }

/* 应用行动 */
function doAction(actId){
  const act = ACTIONS.find(a=>a.id===actId);
  if(!act) return;
  if(state.energy<=0) return;
  state.energy--;
  const tired = state.stamina < 25;
  const gains = {};
  Object.entries(act.stats).forEach(([k,v])=>{
    const actual = tired ? Math.max(1, Math.floor(v*0.6)) : v;
    state.player.attrs[k] = Math.min(100, (state.player.attrs[k]||0)+actual);
    gains[k] = actual;
  });
  state.stamina = Math.max(0, state.stamina - 5);
  state.mood = Math.max(0, Math.min(100, state.mood + (act.mood||0)));
  if(act.stamina) state.stamina = Math.min(100, state.stamina + act.stamina);
  // 社交偶遇
  if(act.encounter){
    const c = rnd(CHARACTERS);
    const aff = rand(2,5);
    addAff(c.id, aff);
    state.log.unshift(`和${c.name}聊得很开心（好感+${aff}）`);
    // 好感达标时概率触发专属剧情
    const pending = (c.stories||[]).map((s,i)=>[s,i]).filter(([s,i])=> af(c.id)>=s.min && !state.flags['story:'+c.id+':'+i]);
    if(pending.length && Math.random()<0.6){
      const [s,i] = pending[0];
      state.flags['story:'+c.id+':'+i] = true;
      showEvent({char:c.id, text:s.text, stats:gains, choices:[{t:'继续',next:'after-event'}]});
      return;
    }
    const line = c.lines[rand(0,c.lines.length-1)];
    showEvent({char:c.id, text:`课间，你遇到了${c.name}。\n\n「${line}」`, stats:gains, choices:[{t:'继续',next:'after-event'}]});
    return;
  }
  if(act.id==='date'){
    return doDate(gains);
  }
  // 选择性事件（分支抉择，打破每周单调）
  if(Math.random()<0.45){
    return triggerChoiceEvent();
  }
  // 随机小事件（带选项）
  if(Math.random()<0.20){
    const e = rnd(RANDOM_EVENTS);
    state.log.unshift(e.title);
    showEvent({text:e.text, choices:e.choices});
    return;
  }
  state.log.unshift(`${act.name}${Object.keys(gains).length?`（${Object.entries(gains).map(([k,v])=>`${ATTRS.find(a=>a.k===k).n}+${v}`).join('、')}）`:''}`);
  showEvent({text:`你选择了「${act.name}」。${act.desc}`, stats:gains, choices:[{t:'继续',next:'after-event'}]});
}

/* 约会 */
function doDate(gains){
  const c = BY_ID[state.dateTarget];
  if(!c) return;
  const affBefore = af(c.id);
  const aff = rand(5,9);
  addAff(c.id, aff);
  state.log.unshift(`和${c.name}约会，感情升温（好感+${aff}）`);
  const isRomance = c.gender!==state.gender;
  const scene = isRomance ? rnd(c.date||['你们一起度过了美好的时光。']) : `你们像最好的朋友一样玩耍，度过了一段愉快的时光。`;
  let text = `天台的风很温柔。你和${c.name}并肩而立。\n\n${scene}`;
  const extraChoices = [];
  // 好感足够 → 可告白（第三年）
  if(isRomance && affBefore>=60 && year()>=3){
    extraChoices.push({t:'💘 鼓起勇气告白', act:'confess'});
  }
  showEvent({bg:'rooftop', char:c.id, text, stats:gains, choices:[...extraChoices, {t:'珍惜这段时光',next:'after-event'}]});
  // 保存目标
  state.evt.target = c.id;
}

/* 通用事件弹窗 */
function showEvent(evt){
  state.evt = evt;
  state.screen='event';
  render();
}

/* 触发一个选择性事件（尽量不重复最近触发过的） */
function triggerChoiceEvent(){
  const used = state.choiceUsed||[];
  let avail = [];
  for(let i=0;i<CHOICE_EVENTS.length;i++) if(!used.includes(i)) avail.push(i);
  if(!avail.length){ avail = CHOICE_EVENTS.map((_,i)=>i); state.choiceUsed=[]; }
  const idx = avail[rand(0, avail.length-1)];
  state.choiceUsed = (state.choiceUsed||[]).concat([idx]).slice(-12);
  const e = CHOICE_EVENTS[idx];
  showEvent({bg:e.bg||'corridor', char:e.char, text:e.text, choices:e.choices});
}

/* 应用一个选择的效果：好感 / 属性 / 心情 / 体力 */
function applyEffect(effect){
  if(!effect) return;
  if(effect.aff){ Object.entries(effect.aff).forEach(([id,n])=>addAff(id,n)); }
  if(effect.stats){ Object.entries(effect.stats).forEach(([k,v])=>{ state.player.attrs[k]=Math.min(100, Math.max(0, (state.player.attrs[k]||0)+v)); }); }
  if(effect.mood){ state.mood = Math.max(0, Math.min(100, state.mood + effect.mood)); }
  if(effect.stamina){ state.stamina = Math.max(0, Math.min(100, state.stamina + effect.stamina)); }
}
function effectSummary(effect){
  if(!effect) return '';
  const parts=[];
  if(effect.aff) Object.entries(effect.aff).forEach(([id,n])=>{ const c=BY_ID[id]; parts.push(`${c?c.name:id} 好感${n>0?'+':''}${n}`); });
  if(effect.stats) Object.entries(effect.stats).forEach(([k,v])=>{ const a=ATTRS.find(x=>x.k===k); parts.push(`${a?a.n:k} ${v>0?'+':''}${v}`); });
  if(effect.mood) parts.push(`心情 ${effect.mood>0?'+':''}${effect.mood}`);
  if(effect.stamina) parts.push(`体力 ${effect.stamina>0?'+':''}${effect.stamina}`);
  return parts.length?`（${parts.join('、')}）`:'';
}
function applyChoiceEvent(evt, ch){
  applyEffect(ch.effect);
  // 连锁剧情：中断或推进到下一章
  if(evt.chain && state.chain){
    if(ch.endChain){ state.chain=null; }
    else {
      state.chain.step++;
      if(!CHAINS[state.chain.id] || state.chain.step >= CHAINS[state.chain.id].length){ state.chain=null; }
    }
  }
  const note = effectSummary(ch.effect);
  showEvent({bg: evt.bg||'corridor', char: evt.char, text:(ch.result||'')+(note?`\n\n${note}`:''), choices:[{t:'继续', next:'after-event'}]});
}

/* 周推进 */
function advanceWeek(){
  state.week++;
  state.energy=3;
  state.stamina = Math.min(100, state.stamina + 20);
  state.mood = Math.min(100, state.mood + 5);
  // 期末/大事件
  const sched = getScheduled(state.week);
  if(sched){ state.evt = sched; state.screen='event'; return render(); }
  if(state.week>WEEKS_PER_YEAR*3){ return finishGame(); }
  // 连锁剧情续章优先
  if(state.chain && CHAINS[state.chain.id] && state.chain.step < CHAINS[state.chain.id].length){
    return showChainPart();
  }
  // 非大事件周：概率触发连锁剧情或抉择事件
  const r = Math.random();
  const eligible = Object.keys(CHAINS).filter(id=>{
    const g = CHAIN_GATE[id]; if(!g) return true;
    if(g.minYear && year()<g.minYear) return false;
    if(g.minAff){ for(const [cid,min] of Object.entries(g.minAff)) if(af(cid)<min) return false; }
    return true;
  });
  if(eligible.length && r < 0.08){ return startChain(rnd(eligible)); }
  if(r < 0.30){ return triggerChoiceEvent(); }
  state.screen='game';
  render();
}
function finishGame(){
  computeEnding();
  state.screen='ending';
  render();
}

/* =========================================================================
   事件库
========================================================================= */
function getScheduled(week){
  const S = SCHEDULED[week];
  return S ? (typeof S==='function' ? S() : S) : null;
}
function examEvent(name){
  return {
    bg:'classroom', title:name,
    text:`${name}来临。考场上，你提笔作答。\n\n平时的积累在此刻化作分数。`,
    choices:[{t:'交卷',next:'exam-result'}]
  };
}
function examResult(){
  const name = (state.evt && state.evt.title) || '考试';
  const xue = state.player.attrs.xue||0, si=state.player.attrs.si||0;
  const score = Math.round((xue*0.6+si*0.4));
  const stats={};
  const boost = Math.round((score-50)/10);
  if(boost>0){ stats.xue=boost; state.player.attrs.xue=Math.min(100,(state.player.attrs.xue||0)+boost); }
  const rank = score>=95?'年级前五':score>=85?'年级前二十':score>=70?'中上游':'需要加油';
  state.log.unshift(`${name}：${rank}`);
  let text;
  if(score>=90) text=`成绩公布，你名列前茅，${rank}！同学们投来羡慕的目光。`;
  else if(score>=75) text=`成绩公布，你稳定发挥，位列${rank}。继续努力。`;
  else text=`成绩公布，你排在${rank}。别灰心，接下来多用功。`;
  showEvent({bg:'classroom', text, stats, choices:[{t:'继续',next:'after-event'}]});
}
function sportsMeet(name){
  const tn=state.player.attrs.tn||0, wl=state.player.attrs.wl||0;
  const score=Math.round(tn*0.6+wl*0.4);
  const stats={}; if(score>70){stats.tn=2;stats.wl=1; state.player.attrs.tn=Math.min(100,(state.player.attrs.tn||0)+2); state.player.attrs.wl=Math.min(100,(state.player.attrs.wl||0)+1);}
  const res = score>=90?'你在田径赛上一骑绝尘，为班级拿下金牌！':score>=75?'你在接力赛中表现出色，帮助班级取得名次。':'你为班级呐喊助威，一起流汗的时光同样珍贵。';
  return {bg:'playground', title:name, text:`${name}开幕了！跑道、欢呼、青春的热浪。\n\n${res}`, stats, choices:[{t:'挥洒汗水',next:'after-event'}]};
}

/* 连锁剧情的解锁门槛（minYear=起始学年；minAff=需要的好感度） */
const CHAIN_GATE = {
  chongsan: {minYear:3},
  biye: {minYear:3},
  lijing: {minYear:2, minAff:{lijing:35}},
  tianjia: {minYear:2, minAff:{tianjia:35}},
};

/* 连锁剧情控制 */
function startChain(id){
  state.chain = {id, step:0};
  showChainPart();
}
function showChainPart(){
  const ch = state.chain;
  if(!ch || !CHAINS[ch.id]){ state.chain=null; return; }
  const part = CHAINS[ch.id][ch.step];
  if(!part){ state.chain=null; return; }
  showEvent({bg:part.bg||'corridor', char:part.char, text:part.text, choices:part.choices, chain:true});
}

/* =========================================================================
   结局
========================================================================= */
function computeEnding(){
  const a=state.player.attrs;
  // 恋爱结局优先
  if(state.flags.lover){
    const c=BY_ID[state.flags.lover];
    state.ending = {
      icon:'💘', badge:'love', badgeLabel:'恋爱结局',
      title:`与你共度青春 · ${c.name}`,
      text:c.ending || `毕业后的某一天，你和${c.name}再次相遇，故事有了新的开始。`
    };
    return;
  }
  // 友情结局
  if(state.bestFriend && af(state.bestFriend)>=70){
    const c=BY_ID[state.bestFriend];
    state.ending = {
      icon:'🤝', badge:'friend', badgeLabel:'挚友结局',
      title:`一辈子的好朋友 · ${c.name}`,
      text:`虽然青春散场，但你与${c.name}的友情历久弥新。多年后，你们仍会为彼此赴汤蹈火。`
    };
    return;
  }
  // 高考结局
  const score=Math.round((a.xue||0)*0.6+(a.si||0)*0.4);
  let title,text,icon='🎓',badge='school',bl='学业结局';
  if(score>=92){ title='圆梦顶尖学府'; text=`你以优异的成绩考入了心仪的顶尖学府。回望高中三年，每一滴汗水都值得。未来的舞台，正缓缓展开。`; }
  else if(score>=80){ title='考入理想大学'; text=`你如愿考上了一所理想的大学，开始了崭新的大学生活。青春的故事，未完待续。`; }
  else if(score>=65){ title='平平淡淡也是真'; text=`你进入了一所普通的大学，但人生从来不是一场考试决定的。属于你的精彩，还在后面。`; }
  else { title='另辟蹊径'; text=`高考成绩不理想，但你并没有被打倒。你决定闯出属于自己的路，去更广阔的世界看一看。`; icon='🌱'; }
  state.ending = {icon,badge,bl,title,text};
}

/* 告白逻辑 */
function confess(cid){
  const c=BY_ID[cid]; if(!c) return;
  const a=state.player.attrs;
  const aff=af(cid), la=a.la||0;
  const success = aff>=80 || (aff>=70 && la>=70);
  if(success){
    state.flags.lover=cid;
    state.log.unshift(`向${c.name}告白成功！`);
    showEvent({bg:'rooftop', char:cid, text:c.confess||`「其实，我一直都喜欢你。」\n\n${c.name}笑了，那是你见过最好看的笑容。`, choices:[{t:'牵手',next:'lover-end'}]});
  }else{
    addAff(cid, -5);
    state.log.unshift(`向${c.name}告白被拒绝了……`);
    showEvent({bg:'rooftop', char:cid, text:`你鼓起勇气告白，${c.name}却慌乱地低下了头。\n\n「对不起……我还没想好。」\n\n你笑着摇了摇头，说没关系。`, choices:[{t:'继续前行',next:'after-event'}]});
  }
}

/* =========================================================================
   事件处理 (data-action)
========================================================================= */
const HANDLERS = {
  'continue': ()=>{ load(); state.screen='game'; render(); },
  'wipe': ()=>{ clearSave(); state=freshState(); render(); },
  'newgame': ()=>{ state=freshState(); state.screen='name'; render(); },
  'name-ok': ()=>{
    const v=($('#nameInput')?.value||'').trim();
    if(!v) return alert('请输入你的名字');
    state.name=v; state.screen='gender'; render();
  },
  'gender-m': ()=>{ state.gender='m'; state.createStep='draft'; state.screen='draft'; render(); },
  'gender-f': ()=>{ state.gender='f'; state.createStep='draft'; state.screen='draft'; render(); },
  'draft-pick': (el)=>{
    const d=state.draft, cid=el.dataset.cid, attr=el.dataset.attr;
    if(d.picks[attr]) return; // 已选
    if(!d.remaining.includes(attr)) return; // 已分配
    const slot=d.round.find(r=>r.id===cid);
    if(!slot) return;
    const otherPicked = d.round.some(r=>r.id!==cid && r.picked===attr);
    if(otherPicked) return; // 别人已选
    if(slot.picked){ delete d.picks[slot.picked]; }
    slot.picked=attr; d.picks[attr]=cid;
    render();
  },
  'draft-reroll': ()=>{
    const d=state.draft;
    if(d.rerolls<=0) return;
    d.rerolls--; d.round=pick(CHARACTERS,Math.min(3,d.remaining.length)).map(c=>({id:c.id,picked:null}));
    render();
  },
  'draft-confirm': (el)=>{
    const d=state.draft;
    if(d.round.filter(r=>r.picked).length!==d.round.length) return;
    d.round.forEach(r=>{
      const c=BY_ID[r.id];
      const k=r.picked;
      const base = (c.attrs[k]||70)+rand(-2,2);
      state.player.attrs[k] = Math.min(100, Math.max(40, base));
      d.remaining = d.remaining.filter(x=>x!==k);
    });
    d.picks={}; d.round=[]; d.roundNo++;
    render();
  },
  'do-action': (el)=>{
    doAction(el.dataset.act);
    if(state.screen!=='event') render();
  },
  'need-target': ()=>{ alert('请先选择约会对象（在主界面点击"选择约会对象"）。'); },
  'set-date': ()=>{ state.dateScreen=true; state.screen='relations'; render(); },
  'pick-date': ()=>{ state.dateScreen=true; state.screen='relations'; render(); },
  'go-stats': ()=>{ state.screen='stats'; render(); },
  'go-relations': ()=>{ state.screen='relations'; render(); },
  'back-game': ()=>{ state.screen='game'; render(); },
  'event-choice': (el)=>{
    const evt=state.evt||{}; const i=+el.dataset.i;
    const ch=(evt.choices||[])[i]||{next:'after-event'};
    if(ch.act==='confess'){ confess(ch.cid||state.evt.target); return; }
    if(ch.effect){ applyChoiceEvent(evt, ch); return; }
    if(ch.next==='exam-result'){ examResult(); return; }
    if(ch.next==='gaokao-result'){ gaokaoResult(); return; }
    if(ch.next==='graduate'){ finishGame(); return; }
    if(ch.next==='lover-end'){ finishGame(); return; }
    // 默认 after-event
    state.evt=null;
    if(state.energy<=0){ state.screen='weekend'; }
    else { state.screen='game'; }
    render();
  },
  'next-week': ()=>{ advanceWeek(); },
  'nav-game': ()=>{ state.screen='game'; render(); },
  'nav-stats': ()=>{ state.screen='stats'; render(); },
  'nav-relations': ()=>{ state.screen='relations'; render(); },
  'nav-menu': ()=>menu(),
};

function menu(){
  navEl().innerHTML='';
  screen().innerHTML = `
    ${hud()}
    <div class="card fade" style="margin-top:30px;">
      <h1 class="title">⚙️ 菜单</h1>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px;">
        <button class="btn primary block" data-action="menu-save">💾 存档</button>
        <button class="btn block" data-action="back-game">← 返回游戏</button>
        <button class="btn ghost block" data-action="newgame">🔄 重新开始</button>
      </div>
    </div>`;
  // 临时处理
  window.__menuSave = ()=>{ save(); alert('已存档！'); };
  window.__backGame = ()=>{ state.screen='game'; render(); };
}
function handleMenuAction(a){
  if(a==='menu-save'){ save(); alert('已存档！'); }
  else if(a==='back-game'){ state.screen='game'; render(); }
  else if(a==='newgame'){ state=freshState(); state.screen='name'; render(); }
}

/* ---------- 事件委托 ---------- */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const act = el.dataset.action;
  // 约会对象选择：在关系界面点击人物卡片
  if(act==='menu-save'){ save(); alert('已存档！'); return; }
  const fn = HANDLERS[act];
  if(fn) fn(el);
});

/* ---------- 关系界面点击选约会对象 ---------- */
document.addEventListener('click', e=>{
  const card = e.target.closest('[data-cid]');
  if(!card) return;
  const cid = card.dataset.cid;
  const c = BY_ID[cid];
  if(state.screen==='relations'){
    if(state.dateScreen){
      if(c.gender===state.gender || c.romance===false){ alert('约会对象需要是可攻略的异性同学哦。'); return; }
      state.dateTarget=cid; state.dateScreen=false;
      state.screen='game'; render();
    } else if(state.dateTarget===cid){
      // 点击已选约会对象，可选取消或约会
      state.dateScreen=false;
      alert(`${c.name} 已经是你的约会对象啦。`);
    }
  }
});

/* 给关系卡片加上 data-cid 以支持点击选约会对象 */
const origRelations = renderRelations;
renderRelations = function(){
  const chars = [...CHARACTERS].sort((x,y)=>af(y.id)-af(x.id));
  navEl().innerHTML = navBar('relations');
  screen().innerHTML = `
    ${hud()}
    <div class="card fade">
      <div class="between"><h1 class="title" style="font-size:18px;margin:0;">💕 人际关系</h1>
        ${state.bestFriend?`<span class="chip">挚友：${BY_ID[state.bestFriend].name}</span>`:''}</div>
      <p class="hint">${state.dateScreen?'👇 点击一位异性同学，作为约会对象。':'好感度越高，越容易触发专属剧情与结局。'}</p>
    </div>
    <div class="scroll">
      ${chars.map(c=>{
        const a=af(c.id);
        const isRomance = c.gender!==state.gender && c.romance!==false;
        const label = isRomance?'可攻略':'同窗';
        return `<div class="card" data-cid="${c.id}" style="padding:12px;margin-bottom:10px;cursor:pointer;">
          <div class="row">
            <div class="avatar" style="width:46px;height:46px;border-radius:50%;overflow:hidden;flex:0 0 auto;border:2px solid ${isRomance?'var(--accent)':'var(--line)'};">${portraitSVG(c,46)}</div>
            <div style="flex:1;">
              <div class="between"><span class="hud-name" style="font-size:14px;">${c.name} <span class="prole" style="font-size:11px;color:var(--dim)">${c.role}</span></span>
                <span class="small">${isRomance?'💘':(c.gender===state.gender?'🤝':'🤝')} ${label}</span></div>
              <div class="row" style="margin-top:6px;"><span class="heart">♥</span><div class="aff-bar"><div class="fill" style="width:${a}%"></div></div><span class="small">${a}</span></div>
            </div>
          </div>
          <p class="hint" style="margin:8px 0 0;">${c.desc}</p>
        </div>`;
      }).join('')}
    </div>`;
};

/* ---------- 好友挚友更新 ---------- */
function updateBestFriend(){
  let best=null, bestV=0;
  CHARACTERS.forEach(c=>{ if(af(c.id)>bestV && c.gender===state.gender){ bestV=af(c.id); best=c.id; } });
  if(bestV>=50) state.bestFriend=best;
}

/* 钩子：好感度变化时更新挚友 */
const origAddAff = addAff;
addAff = function(id,n){
  const cur=state.affection[id]||0;
  state.affection[id]=Math.max(0,Math.min(100,cur+n));
  if(state.bestFriend===null || !CHARACTERS.some(c=>c.id===id&&c.gender===state.gender)){
    updateBestFriend();
  }
  updateBestFriend();
};

/* ---------- 启动 ---------- */
load();
if(!state) state=freshState();
if(state.screen==='game' && !state.player.attrs || Object.keys(state.player.attrs||{}).length===0){ state.screen='name'; }
render();
